name: Maven CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload runnable application
        uses: actions/upload-artifact@v4
        with:
          name: attendance-tracker-${{ github.sha }}
          path: target/attendance-tracker.jar
          if-no-files-found: error
          retention-days: 14
